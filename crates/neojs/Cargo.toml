[package]
name = "neojs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "neojs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
neojs-core = { path = "../neojs-core" }
neojs-os = { path = "../neojs-os" }
neojs-os-user = { path = "../neojs-os-user" }
neojs-schedulers = { path = "../neojs-schedulers" }
neojs-sqlite = { path = "../neojs-sqlite" }

[dev-dependencies]
same-file = "=1.0.6"
serde_json = "1"
tempfile = "3"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
