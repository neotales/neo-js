[package]
name = "neojs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "neo-js"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
neojs-core = { path = "../neo-js" }
neojs-sqlite = { path = "../neojs-sqlite" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
