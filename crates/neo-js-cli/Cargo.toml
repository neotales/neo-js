[package]
name = "neo-js-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "neo-js"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
neo-js = { path = "../neo-js" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
