name: Windows native

# Hosted Windows has run twice; neither run has passed the gate. Run 44841666909
# failed in neojs/tests/process_stdio.rs on the initial-cwd comparison this
# branch corrects; the correction has not run on Windows. Reaching a hosted
# runner in those runs does not establish organization eligibility or billing;
# see eng/ci/README.md for both run results.

on:
  workflow_dispatch:
    inputs:
      full_workspace_tests:
        description: "Run the full workspace test suite (may expose unverified Windows failures)"
        required: false
        type: boolean
        default: false
  # pull_request: deliberately not enabled yet. A PR trigger would queue a
  # job on every pull request before hosted Windows availability is proven.
  # Enable it only after one successful manual dispatch; see eng/ci/README.md.

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows-native:
    name: Windows x64 MSVC native tests
    # GitHub-hosted standard runner. This is not a self-hosted Windows label.
    # Availability is not asserted by the workflow; an absent runner leaves
    # the job queued or failed, which is the finding.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out without persisting the token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust 1.87.0 MSVC toolchain
        # Do not pass with: toolchain. This action ref accepts only targets,
        # target, and components; the 1.87.0 branch itself selects 1.87.0.
        uses: dtolnay/rust-toolchain@4b54d2ecfeb0fc349341b7929a580d09d9e2479b # 1.87.0

      # Fork pull requests run untrusted code. They still get a read-only
      # checkout and no user secrets, but they do not write a cache that a
      # later run could consume.
      - name: Cache Rust build outputs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-native
          cache-on-failure: false

      - name: Check workflow pins and Cargo targets
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/ci/check-windows-ci.ps1

      - name: Self-test static guard mutations
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/ci/test-windows-ci-check.ps1

      - name: Run native Windows gate
        env:
          NEOJS_FULL_WORKSPACE: ${{ inputs.full_workspace_tests }}
        run: |
          $full = $env:NEOJS_FULL_WORKSPACE -eq 'true'
          if ($full) {
            pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/ci/windows-native.ps1 -FullWorkspace
          }
          else {
            pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/ci/windows-native.ps1
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
