name: Windows native

# Hosted Windows run 44964164697 at 89b966c1382513518cb022f8007d4f9984b24ded
# passed the targeted 101-test gate (including the 42-test filesystem suite
# and the one filtered validation unit test). This revision proposes a second
# exact filtered pure unit test (102 selected source-level) and has not been
# dispatched. Earlier: run 44956915195 at cb685999 passed 100 tests, run
# 44949569504 at c23a21b passed 99, run 44945036146 at 1cc7384 passed 97, and
# run 44845110559 at 51f3994 passed the earlier 58-test gate. Run 44936430027
# at 2703526 failed before any mkdir test passed, and run 44943444444 at
# 8475b21 reported FS_ALREADY_EXISTS for async recursive mkdir below an
# intermediate regular file; those failures led to the fixed-label diagnostics
# now in the suite.
# This workflow is configured to run the neojs-core filesystem suite (42
# Windows-selected integration tests) and two exact filtered pure unit tests
# (102 selected source-level across its invocations), including Windows-only
# metadata/directory, fail-closed reparse, and mkdir coverage. Only the first
# of the two filtered unit tests has run on Windows. The mkdir
# diagnostic logs sanitized missing-parent and intermediate-file codes before
# asserting them, with fixed labels and no path; the non-recursive result is
# restricted to FS_NOT_FOUND or FS_NOT_DIRECTORY, and the recursive result also
# accepts the observed FS_ALREADY_EXISTS. Reaching a hosted runner does not
# establish organization eligibility or billing; see eng/ci/README.md for the
# run results and the current revision status.

on:
  workflow_dispatch:
    inputs:
      full_workspace_tests:
        description: "Run the full workspace test suite (may expose unverified Windows failures)"
        required: false
        type: boolean
        default: false
  # pull_request: deliberately not enabled yet. The targeted gate has passed
  # on manual dispatches, but this proposed 102-test revision has not run.
  # Enabling it is a separate reviewed change after the current revision
  # passes; see eng/ci/README.md.

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows-native:
    name: Windows x64 MSVC native tests
    # GitHub-hosted standard runner. This is not a self-hosted Windows label.
    # Availability is not asserted by the workflow; an absent runner leaves
    # the job queued or failed, which is the finding.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out without persisting the token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust 1.87.0 MSVC toolchain
        # Do not pass with: toolchain. This action ref accepts only targets,
        # target, and components; the 1.87.0 branch itself selects 1.87.0.
        uses: dtolnay/rust-toolchain@4b54d2ecfeb0fc349341b7929a580d09d9e2479b # 1.87.0

      # Fork pull requests run untrusted code. They still get a read-only
      # checkout and no user secrets, but they do not write a cache that a
      # later run could consume.
      - name: Cache Rust build outputs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-native
          cache-on-failure: false

      - name: Check workflow pins and Cargo targets
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/ci/check-windows-ci.ps1

      - name: Self-test static guard mutations
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/ci/test-windows-ci-check.ps1

      - name: Run native Windows gate
        env:
          NEOJS_FULL_WORKSPACE: ${{ inputs.full_workspace_tests }}
        run: |
          $full = $env:NEOJS_FULL_WORKSPACE -eq 'true'
          if ($full) {
            pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/ci/windows-native.ps1 -FullWorkspace
          }
          else {
            pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./eng/ci/windows-native.ps1
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
